<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitton Booth - Camera Test</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; margin: 0; }
        #live-feed { width: 100%; max-width: 600px; border: 4px solid #333; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <video id="live-feed" autoplay playsinline></video>

    <script>
        const videoElement = document.getElementById('live-feed');

        // Request access to the webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                // If successful, pipe the camera stream into the video element
                videoElement.srcObject = stream;
            })
            .catch(err => {
                console.error("Camera access denied or unavailable:", err);
                alert("Please allow camera permissions to use Fitton Booth.");
            });
    </script>
</body>
</html>
