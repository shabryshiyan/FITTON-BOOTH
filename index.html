<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitton Booth</title>
    <style>
        body { display: flex; font-family: sans-serif; padding: 20px; gap: 20px; background-color: #f0f0f0; }
        .camera-container { flex: 1; }
        #live-feed { width: 100%; border: 4px solid #333; border-radius: 8px; }
        .inventory-container { width: 300px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .dress-item { padding: 10px; border-bottom: 1px solid #ddd; cursor: pointer; }
        .dress-item:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <div class="camera-container">
        <h2>Live Mirror</h2>
        <video id="live-feed" autoplay playsinline></video>
    </div>

    <div class="inventory-container">
        <h2>Dress Catalog</h2>
        <div id="dress-list">Loading dresses from backend...</div>
    </div>

    <script>
        // 1. Start the Camera
        const videoElement = document.getElementById('live-feed');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { videoElement.srcObject = stream; })
            .catch(err => { console.error("Camera access denied:", err); });

        // 2. Fetch Inventory from Python Backend
        async function loadInventory() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/inventory');
                const data = await response.json();
                
                const dressListDiv = document.getElementById('dress-list');
                dressListDiv.innerHTML = ''; // Clear the "Loading" text

                // Loop through the dresses from Python and display them
                data.dresses.forEach(dress => {
                    const dressDiv = document.createElement('div');
                    dressDiv.className = 'dress-item';
                    dressDiv.innerHTML = `<strong>${dress.name}</strong> <br> $${dress.price}`;
                    dressListDiv.appendChild(dressDiv);
                });
            } catch (error) {
                console.error("Error fetching inventory:", error);
                document.getElementById('dress-list').innerHTML = "Failed to load inventory.";
            }
        }

        // Run the fetch function when the page loads
        loadInventory();
    </script>
</body>
</html>
